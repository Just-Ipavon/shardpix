[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shardpix"
version = "1.1.0"
description = "Encrypt a file and hide k-of-n shares of its key in ordinary-looking images."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pasquale Ruotolo" }]
dependencies = [
    "cryptography>=42",
    "jpeglib>=1.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/Just-Ipavon/shardpix"
Documentation = "https://github.com/Just-Ipavon/shardpix/tree/main/docs"
Issues = "https://github.com/Just-Ipavon/shardpix/issues"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "ruff>=0.5",
    "scipy>=1.10",
]
audit = [
    "bandit>=1.7",
    "mutmut>=3.0",
    "pip-audit>=2.7",
]
bench = [
    "matplotlib>=3.7",
    "scikit-image>=0.22",
]
ml = [
    "matplotlib>=3.7",
    "torch>=2.2",
]

[project.scripts]
shardpix = "shardpix.cli:main"

[tool.setuptools.packages.find]
include = ["shardpix*"]

[tool.mutmut]
source_paths = ["shardpix/gf256.py", "shardpix/shamir.py", "shardpix/stego.py", "shardpix/vault.py"]
tests_dir = ["tests/"]
also_copy = ["shardpix/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
