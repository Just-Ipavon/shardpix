name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest -q

  windows:
    # The CLI is used from PowerShell too: paths, wildcards, temporary files.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,audit]" semgrep==1.184.0

      - name: Static analysis (bandit)
        run: bandit -q -r shardpix

      - name: Static analysis (semgrep)
        # Vendored rule set: reviewed with the code, not fetched at run time.
        run: semgrep scan --config .semgrep/python.yml --error --metrics=off shardpix

      - name: Known vulnerabilities in dependencies (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Property-based tests, fuzzing profile
        run: pytest -q tests/test_properties.py
        env:
          HYPOTHESIS_PROFILE: fuzz

  ml:
    # The CNN steganalysis tests need PyTorch (CPU build), absent from [dev].
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ml]"

      - name: Test (torch-dependent tests run here)
        run: pytest -q tests/test_ml.py -rs
