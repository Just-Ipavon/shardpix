name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  windows:
    # The CLI is used from PowerShell too: paths, wildcards, temporary files.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,audit]" semgrep

      - name: Static analysis (bandit)
        run: bandit -q -r shardpix

      - name: Static analysis (semgrep)
        run: semgrep scan --config p/python --error --metrics=off shardpix

      - name: Known vulnerabilities in dependencies (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Property-based tests, fuzzing profile
        run: pytest -q tests/test_properties.py
        env:
          HYPOTHESIS_PROFILE: fuzz
